name: Build miniaudio Native

# Per-RID build of the ahjo_miniaudio shared library. Each job builds the
# binary for one RID, RUNS Ahjo.Miniaudio.Native.Tests against it (version
# pin, struct-layout oracle, null-backend device lifecycle), and only then
# uploads it as the workflow artifact miniaudio-native-<rid>.
#
# Defined once and called by both ci.yml and publish.yml, so the binary a
# release ships comes from the same definition CI proves.
#
# One set of managed bindings serves every RID (the platform-dependent
# runtime state is opaque; see CLAUDE.md, "Platform layouts"), but each RID's
# binary still has to prove it: LayoutTests compares the bindings against
# that binary's compiler. A RID is added to PackMiniaudioRuntimes only after
# its lane here passes.
#
# Linux builds on the oldest hosted Ubuntu: the glibc it links against is
# the floor for consumers (22.04 -> glibc 2.35).

on:
  workflow_call: {}
  workflow_dispatch: {}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build + smoke miniaudio (${{ matrix.rid }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runs-on: windows-latest
            lib-file: ahjo_miniaudio.dll
          - rid: win-arm64
            runs-on: windows-11-arm
            lib-file: ahjo_miniaudio.dll
          - rid: linux-x64
            runs-on: ubuntu-22.04
            lib-file: libahjo_miniaudio.so
          - rid: linux-arm64
            runs-on: ubuntu-22.04-arm
            lib-file: libahjo_miniaudio.so
          - rid: osx-arm64
            runs-on: macos-latest
            lib-file: libahjo_miniaudio.dylib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Builds the native library through the csproj's BuildMiniaudioForHost
      # target, so CI and a local `dotnet build` take the same path.
      - name: Build
        run: dotnet build tests/Ahjo.Miniaudio.Native.Tests/Ahjo.Miniaudio.Native.Tests.csproj -c Release

      - name: Test — Ahjo.Miniaudio.Native.Tests
        run: dotnet test --project tests/Ahjo.Miniaudio.Native.Tests/Ahjo.Miniaudio.Native.Tests.csproj -c Release --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniaudio-native-${{ matrix.rid }}
          path: native/miniaudio/staged/${{ matrix.rid }}/${{ matrix.lib-file }}
          if-no-files-found: error
          retention-days: 14
