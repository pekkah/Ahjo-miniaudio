name: Publish

# Triggers and what they ship:
#   push to main       → preview package (MinVer: 0.0.0-alpha.0.<height> until
#                        the first tag, then 0.x.y-alpha.0.<height>).
#   release published  → stable package. Tag the commit v0.1.0 and publish a
#                        GitHub Release on that tag; the nupkgs are attached
#                        back to the release.
#   workflow_dispatch  → manual. `release=false` packs without pushing
#                        (artifact-only dry-run); `version` forces a version.
#
# Pushing to NuGet.org is OFF until explicitly enabled. It needs BOTH:
#   - the repository variable NUGET_PUBLISH set to `true`
#     (gh variable set NUGET_PUBLISH --body true), and
#   - the NUGET_KEY repository secret.
# Until then every trigger still builds, tests and packs, and uploads the
# packages as the `nuget-packages` workflow artifact — nothing leaves GitHub.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional MinVer version override (e.g. 0.1.0). Leave blank to use git tag."
        required: false
        type: string
      release:
        description: "Push to NuGet.org. Default: pack only (artifact upload, no push)."
        required: false
        type: boolean
        default: false

# One in-flight publish per ref; never cancel — a half-published nupkg is
# worse than a slow queue.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-native:
    name: Build miniaudio native (matrix)
    uses: ./.github/workflows/build-miniaudio-native.yml

  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    needs: [build-native]
    permissions:
      contents: write
    env:
      # Read through env so the push step can skip cleanly (rather than fail)
      # until the secret is configured; `secrets` is not allowed in `if:`.
      NUGET_KEY: ${{ secrets.NUGET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # MinVer walks history for the nearest tag; Source Link embeds the
          # commit. Both need full history.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Stage every RID's artifact where PackMiniaudioRuntimes looks:
      # native/miniaudio/staged/<rid>/<libname>.
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: miniaudio-native-*
          path: ${{ github.workspace }}/native-artifacts

      - name: Stage native binaries for pack
        run: |
          for dir in "${{ github.workspace }}"/native-artifacts/miniaudio-native-*; do
            rid="${dir##*/miniaudio-native-}"
            mkdir -p "native/miniaudio/staged/${rid}"
            cp -v "$dir"/* "native/miniaudio/staged/${rid}/"
          done

      # SkipMiniaudioNativeBuild: the binaries were built and tested by the
      # matrix above; this Linux runner must not build its own host binary.
      - name: Pack
        env:
          MinVerVersionOverride: ${{ inputs.version }}
        run: >-
          dotnet pack src/Ahjo.Miniaudio.Native/Ahjo.Miniaudio.Native.csproj
          -c Release
          -p:SkipMiniaudioNativeBuild=true
          -o "${{ github.workspace }}/artifacts"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ github.workspace }}/artifacts/*.*nupkg
          if-no-files-found: error

      - name: Push to NuGet.org
        if: vars.NUGET_PUBLISH == 'true' && env.NUGET_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.release == true)
        run: >-
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key "$NUGET_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ github.workspace }}/artifacts/*.nupkg
            ${{ github.workspace }}/artifacts/*.snupkg
