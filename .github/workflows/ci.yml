name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # Whole solution: wrapper + native suites. Every test uses miniaudio's null
  # backend, so the hosted runner's lack of an audio device costs no coverage.
  build-test:
    name: Build & Test (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build (Release)
        run: dotnet build Ahjo.Miniaudio.slnx -c Release

      - name: Test
        run: dotnet test --solution Ahjo.Miniaudio.slnx -c Release --no-build

      # The sample is the Native AOT check: publishing with PublishAot=true
      # turns any trim/AOT warning reachable from the libraries into a build
      # failure. Running the published exe on the null backend then proves the
      # AOT binary and the copied ahjo_miniaudio.dll actually play audio.
      - name: AOT publish — HelloAudio
        run: dotnet publish samples/HelloAudio/HelloAudio.csproj -c Release -r win-x64

      - name: AOT run — HelloAudio (null backend)
        shell: pwsh
        run: |
          samples/HelloAudio/bin/Release/net11.0/win-x64/publish/HelloAudio.exe --null
          if ($LASTEXITCODE -ne 0) { throw "HelloAudio exited with code $LASTEXITCODE" }
          # --pull plays the engine through an AudioDevice: the unmanaged
          # render callback running on miniaudio's thread, under AOT.
          samples/HelloAudio/bin/Release/net11.0/win-x64/publish/HelloAudio.exe --null --pull
          if ($LASTEXITCODE -ne 0) { throw "HelloAudio --pull exited with code $LASTEXITCODE" }

  # The shippable per-RID binaries, built and smoke-tested by the same
  # reusable workflow publish.yml uses.
  native:
    name: miniaudio native
    uses: ./.github/workflows/build-miniaudio-native.yml
